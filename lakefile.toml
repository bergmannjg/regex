name = "Regex"
testDriver = "test"
lintDriver = "batteries/runLinter"
defaultTargets = ["inspect", "benchmark"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"

[[require]]
name = "UnicodeData"
git = "https://github.com/fgdorais/lean4-unicode-data"
rev = "24e9b668a6550ec02ad625c92ae5835918a46246"

[[require]]
name = "ParseIt"
git = "https://github.com/fgdorais/lean4-parseit"
rev = "e411c02b878b2149bb632575762648432189068b"

[[lean_lib]]
name = "Regex"
buildType = "debug"

[[lean_lib]]
name = "Test"
srcDir = "test"
roots = ["Test", "RegexTest", "TomlLoader", "PcreLoader"]

[[lean_exe]]
name = "inspect"
root = "Main"
buildType = "debug"

[[lean_exe]]
name = "benchmark"
root = "Benchmark"
buildType = "debug"

[[lean_exe]]
name = "test"
srcDir = "test"
root = "Test"
