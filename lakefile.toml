name = "Regex"
testDriver = "test"
lintDriver = "batteries/runLinter"
defaultTargets = ["inspect", "benchmark"]

[[require]]
name = "UnicodeData"
git = "https://github.com/fgdorais/lean4-unicode-data"
rev = "176a889c4d4a31667ec5bf44a6e4a4291ef32e81"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "3db7189e9142c9c463a53bd8b360fea2b78f4be5"

[[lean_lib]]
name = "Regex"
buildType = "debug"

[[lean_lib]]
name = "Test"
srcDir = "test"
roots = ["Test", "RegexTest", "TomlLoader", "PcreLoader"]

[[lean_exe]]
name = "inspect"
root = "Main"
buildType = "debug"

[[lean_exe]]
name = "benchmark"
root = "Benchmark"
buildType = "debug"

[[lean_exe]]
name = "test"
srcDir = "test"
root = "Test"
