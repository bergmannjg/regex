name = "Regex"
testDriver = "test"
lintDriver = "batteries/runLinter"
defaultTargets = ["inspect", "benchmark"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "b4b25a3886a16daacaf6615c2eea7170a6e8f458"

[[require]]
name = "UnicodeData"
git = "https://github.com/fgdorais/lean4-unicode-data"
rev = "3b9e665273259dce85f770af988f01a87b97bd4e"

[[require]]
name = "ParseIt"
git = "https://github.com/fgdorais/lean4-parseit"
rev = "f53b3986c483c3907fc2a7606f7ecf0d3953f4fc"

[[require]]
name = "Lemmas"
git = "https://github.com/bergmannjg/lean4-parseit-lemmas"
rev = "v4.36.0"

[[lean_lib]]
name = "Regex"
buildType = "debug"

[[lean_lib]]
name = "Test"
srcDir = "test"
roots = ["Test", "RegexTest", "TomlLoader", "PcreLoader"]

[[lean_exe]]
name = "inspect"
root = "Main"
buildType = "debug"

[[lean_exe]]
name = "benchmark"
root = "Benchmark"
buildType = "debug"

[[lean_exe]]
name = "test"
srcDir = "test"
root = "Test"
