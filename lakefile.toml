name = "Regex"
testDriver = "test"
lintDriver = "batteries/runLinter"
defaultTargets = ["inspect", "benchmark"]

[[require]]
name = "UnicodeBasic"
git = "https://github.com/fgdorais/lean4-unicode-basic"
rev = "a2e430a4c9d3ad24078b8581fe0162fc5b0c9a6c"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.31.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "bf30b2e6908d116223918daacb66477b4d62e20a"

[[lean_lib]]
name = "Regex"
buildType = "debug"

[[lean_lib]]
name = "Test"
srcDir = "test"
roots = ["Test", "RegexTest", "TomlLoader", "PcreLoader"]

[[lean_exe]]
name = "inspect"
root = "Main"
buildType = "debug"

[[lean_exe]]
name = "benchmark"
root = "Benchmark"
buildType = "debug"

[[lean_exe]]
name = "test"
srcDir = "test"
root = "Test"
